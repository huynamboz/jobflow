services:
  db:
    # feature 027 Stage B: postgres:16-alpine + pgvector (same alpine base → the
    # existing pgdata volume mounts without a libc/collation mismatch).
    build:
      context: .
      dockerfile: docker/postgres-pgvector.Dockerfile
    image: jobflow-postgres-pgvector:16
    container_name: jobflow-db
    environment:
      POSTGRES_DB: jobflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jobflow-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
